<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050913" />
    <meta name="description" content="SuiTrump: FUD Breach — a single-player browser arena shooter." />
    <title>SuiTrump: FUD Breach</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="SuiTrump FUD Breach">
      <canvas id="game-canvas" tabindex="0" aria-label="3D game canvas"></canvas>
      <canvas id="hud-canvas" aria-hidden="true"></canvas>
      <button id="mission-action" type="button" hidden></button>
      <button id="score-action" type="button" hidden>Share score</button>
      <dialog id="score-dialog" aria-labelledby="score-heading">
        <h2 id="score-heading">Breach score</h2>
        <textarea id="score-summary" readonly aria-label="Shareable score"></textarea>
        <div class="score-dialog-actions">
          <button id="copy-score" type="button">Copy score</button>
          <button id="download-score" type="button">Download receipt</button>
          <button id="close-score" type="button">Close</button>
        </div>
        <p id="score-feedback" role="status"></p>
      </dialog>
      <div id="touch-controls" aria-label="Touch controls">
        <div id="move-pad" class="touch-pad"><span></span></div>
        <div id="aim-pad" class="touch-pad"><span></span></div>
        <button id="dash-button" class="touch-button" type="button">DASH</button>
        <button id="pulse-button" class="touch-button" type="button">PULSE</button>
        <button id="pause-button" class="touch-button" type="button" aria-label="Pause mission">PAUSE</button>
        <button id="weapon-button" class="touch-button" type="button" aria-label="Switch weapon">REPEATER</button>
      </div>
      <div id="rotate-prompt" role="status">
        <strong>ROTATE TO LANDSCAPE</strong>
        <span>FUD Breach needs room for the crossfire.</span>
      </div>
      <section id="startup-error" role="alert" hidden>
        <div class="startup-error-card">
          <p class="startup-error-kicker">RENDERER OFFLINE</p>
          <h1 id="startup-error-title">WebGL is unavailable</h1>
          <p id="startup-error-detail">
            This browser could not create the graphics context required by the game.
          </p>
          <p class="startup-error-action">Open the game in a browser with WebGL 2 and hardware acceleration enabled.</p>
        </div>
      </section>
      <div class="scanlines" aria-hidden="true"></div>
    </main>
    <script type="module" src="./src/bootstrap.js"></script>
  </body>
</html>
